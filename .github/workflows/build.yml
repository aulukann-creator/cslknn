name: Derle

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "icons/**"
      - "index.html"
      - ".nojekyll"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: builds dalını al
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Eski paketleri temizle
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kaynak motorunu test et
        working-directory: src
        run: |
          pip install -q -r tools/requirements.txt
          python -m unittest discover -s tools -p 'test_*.py' -v

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # Android SDK, GitHub'ın ubuntu imajında hazır kurulu geliyor (ANDROID_HOME)
      - name: Gradle önbelleği
        uses: gradle/actions/setup-gradle@v4

      - name: Eklentileri derle
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson --stacktrace
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds
          cp build/plugins.json $GITHUB_WORKSPACE/builds
          python3 tools/bundle.py $GITHUB_WORKSPACE/builds/sources.json

      - name: Paketleri builds dalına gönder
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Derleme $GITHUB_SHA" || exit 0
          git push --force
